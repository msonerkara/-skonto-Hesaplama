<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">

manifest.json

<title>İskonto Pro V4</title>


manifest.json

	
	<style>
		body {
			font-family: Arial, sans-serif;
			background: #f4f6fa;
			padding: 5px;
			margin: 0;
		}



		.card {
			background: white;
			padding: 15px;
			border-radius: 15px;
			box-shadow: 0 3px 15px rgba(0, 0, 0, .15);
			width: 100%;
			max-width: none;
			margin: 0;
			box-sizing: border-box;
		}


		h2 {
			margin-top: 0;
		}

		input {
			width: 100%;
			padding: 12px;
			margin: 8px 0;
			box-sizing: border-box;
			border: 1px solid #ccc;
			border-radius: 8px;
		}

		button {
			width: 100%;
			padding: 14px;
			border: none;
			border-radius: 8px;
			background: #2563eb;
			color: white;
			font-size: 16px;
		}

		.result {
			background: #eef5ff;
			padding: 15px;
			border-radius: 10px;
			margin-top: 15px;
			border-left: 5px solid #2563eb;
		}

		.tabs {
			display: flex;
			gap: 10px;
			margin-bottom: 15px;
		}

		.tab {
			flex: 1;
			padding: 12px;
			border: none;
			border-radius: 10px;
			font-size: 16px;
			font-weight: bold;
			background: #dbeafe;
			color: #1e3a8a;
		}

		.tab.active {
			background: #2563eb;
			color: white;
		}

		.page {
			display: none;
		}

		.page.active {
			display: block;
		}
	</style>
</head>

<body>

	<div class="tabs">

		<button id="btnPesin" class="tab active" onclick="showPage('pesin')">

			Peşin İskonto

		</button>

		<button id="btnCek" class="tab" onclick="showPage('cek')">

			Çek İskonto

		</button>


	</div>


	<div id="pesin" class="page active">

		<div class="card">


			<h2>Peşin İskonto</h2>

			<input id="tutar" inputmode="decimal" placeholder="İşlem Tutarı">


			<input id="faiz" inputmode="decimal" placeholder="Faiz Oranı %">

			<input id="komisyon" inputmode="decimal" placeholder="Komisyon Oranı %">

			<input id="masraf" inputmode="decimal" placeholder="Masraf">

			<input id="vade" inputmode="decimal" placeholder="Vade Gün">

			<button onclick="hesapla()">
				HESAPLA
			</button>

			<button onclick="temizle()">
				TEMİZLE
			</button>

			<div id="sonuc" class="result">

				Hesaplama sonucu burada görüntülenecektir.

			</div>

		</div>

	</div>

	<!-- BURAYA ÇEK SAYFASI GELECEK -->

	<div id="cek" class="page">

		<div class="card">

			<h2>Çek İskonto</h2>

			<input id="cekFaiz" inputmode="decimal" oninput="listeGuncelle()" placeholder="Faiz Oranı %">

			<input id="cekKomisyon" inputmode="decimal" oninput="listeGuncelle()" placeholder="Komisyon Oranı %">

			<input id="cekMasraf" inputmode="decimal" oninput="listeGuncelle()" placeholder="Masraf">

			<div class="result">

				<b>ÇEK GİRİŞİ</b>

			</div>
			<label><b>Çek Tutarı</b></label>

			<input id="cekTutar" inputmode="decimal">

			<label><b>📅 Vade Tarihi</b></label>

			<input id="cekTarih" type="date" style="
font-size:18px;
font-weight:bold;
background:white;
">



			<button onclick="cekEkle()">
				ÇEK EKLE
			</button>

			<div id="cekOzet" class="result">

				Toplam Çek Tutarı: 0,00 TL

				<br><br>

				Ortalama Vade: 0 Gün

			</div>


			<div id="cekListe" class="result">

				Çek listesi burada görüntülenecektir.

			</div>

			<div id="cekSonuc" class="result">

				Hesaplama sonucu burada görüntülenecektir.

			</div>

		</div>

	</div>


	<script>
		let cekler = [];


		const tatiller = [

			"2026-01-01",
			"2026-03-20",
			"2026-03-21",
			"2026-03-22",
			"2026-03-23",
			"2026-04-23",
			"2026-05-01",
			"2026-05-19",
			"2026-05-26",
			"2026-05-27",
			"2026-05-28",
			"2026-05-29",
			"2026-05-30",
			"2026-07-15",
			"2026-08-30",
			"2026-10-28",
			"2026-10-29",

			"2027-01-01",
			"2027-03-08",
			"2027-03-09",
			"2027-03-10",
			"2027-05-01",
			"2027-05-16",
			"2027-05-17",
			"2027-05-18",
			"2027-05-19",
			"2027-07-15",
			"2027-08-30",
			"2027-10-28",
			"2027-10-29",
			"2028-01-01",

			"2028-02-25",
			"2028-02-26",
			"2028-02-27",
			"2028-02-28",

			"2028-04-23",

			"2028-05-01",

			"2028-05-04",
			"2028-05-05",
			"2028-05-06",
			"2028-05-07",
			"2028-05-08",

			"2028-05-19",

			"2028-07-15",

			"2028-08-30",

			"2028-10-28",
			"2028-10-29"

		];

		function isIsGunu(tarih) {

			let gun = tarih.getDay();

			let tarihStr =
				tarih.toISOString().split("T")[0];

			return (
				gun !== 0 &&
				gun !== 6 &&
				!tatiller.includes(tarihStr)
			);

		}

		function isGunuEkle(tarih, adet) {

			let sonuc = new Date(tarih);

			while (adet > 0) {

				sonuc.setDate(
					sonuc.getDate() + 1
				);

				if (isIsGunu(sonuc)) {
					adet--;
				}

			}

			return sonuc;

		}


		function tl(x) {

			return x.toLocaleString(
				"tr-TR", {
					minimumFractionDigits: 2,
					maximumFractionDigits: 2
				}
			);

		}

		function hesapla() {

			if (
				!document.getElementById("tutar").value ||
				!document.getElementById("faiz").value ||
				!document.getElementById("komisyon").value ||
				!document.getElementById("masraf").value ||
				!document.getElementById("vade").value
			) {

				alert("Lütfen tüm alanları doldurunuz.");
				return;

			}

			let tutar =
				parseFloat(
					document.getElementById("tutar").value
				) || 0;

			let faiz =
				parseFloat(
					document.getElementById("faiz").value
					.replace(",", ".")
				) || 0;


			let komisyon =
				parseFloat(
					document.getElementById("komisyon").value
					.replace(",", ".")
				) || 0;

			let masraf =
				parseFloat(
					document.getElementById("masraf").value
					.replace(",", ".")
				) || 0;


			let vade =
				parseFloat(
					document.getElementById("vade").value
				) || 0;

			let faizTutari =
				(tutar * faiz * vade) / 36000;

			let komisyonTutari =
				(tutar * komisyon) / 100;

			let bsmv =
				(faizTutari +
					komisyonTutari +
					masraf) * 0.05;

			let toplamKesinti =
				faizTutari +
				komisyonTutari +
				masraf +
				bsmv;

			let netOdeme =
				tutar - toplamKesinti;

			let basitOran = 0;
			let katkiliOran = 0;

			if (netOdeme > 0 && vade > 0) {

				katkiliOran =
					(
						(faiz + ((360 / vade) * komisyon)) *
						tutar /
						netOdeme
					);

			}

			if (vade > 0 && tutar > 0) {

				basitOran =
					(
						(toplamKesinti / 1.05) *
						36000 /
						tutar /
						vade
					);

			}

			let getiri = 0;

			if (vade > 0) {

				getiri =
					(
						(
							(faizTutari + komisyonTutari + masraf) *
							36000
						) /
						(
							(
								((tutar - netOdeme) / 1.05) *
								0.05 +
								netOdeme
							) *
							vade
						)
					);

			}

			document.getElementById("sonuc").innerHTML =
				`

<b>Faiz Tutarı:</b>
${tl(faizTutari)}

<br><br>

<b>Komisyon Tutarı:</b>
${tl(komisyonTutari)}

<br><br>

<b>BSMV:</b>
${tl(bsmv)}

<br><br>

<b>Toplam Kesinti:</b>
${tl(toplamKesinti)}

<br><br>

<b>Net Ödeme:</b>
${tl(netOdeme)}

<br><br>

<b>Basit Oran:</b>
% ${basitOran.toFixed(2)}

<br><br>

<b>Katkılı Oran:</b>
% ${katkiliOran.toFixed(2)}

<br><br>

<b>Getiri:</b>
% ${getiri.toFixed(2)}

`;

		}

		function temizle() {

			document.getElementById("tutar").value = "";
			document.getElementById("faiz").value = "";
			document.getElementById("komisyon").value = "";
			document.getElementById("masraf").value = "";
			document.getElementById("vade").value = "";

			document.getElementById("sonuc").innerHTML =
				"Hesaplama sonucu burada görünecektir.";

		}

		function showPage(page) {

			document.getElementById("pesin").classList.remove("active");
			document.getElementById("cek").classList.remove("active");

			document.getElementById("btnPesin").classList.remove("active");
			document.getElementById("btnCek").classList.remove("active");

			if (page == "pesin") {

				document.getElementById("pesin").classList.add("active");
				document.getElementById("btnPesin").classList.add("active");

			} else {

				document.getElementById("cek").classList.add("active");
				document.getElementById("btnCek").classList.add("active");

			}

		}

		function cekEkle() {

			let tutar =
				parseFloat(
					document.getElementById("cekTutar").value
					.replace(",", ".")
				) || 0;

			let tarih =
				document.getElementById("cekTarih").value;

			if (tutar <= 0 || !tarih) {

				alert("Çek tutarı ve tarih giriniz.");
				return;

			}

			let vadeTarihi = new Date(tarih);

			let valorluVade =
				isGunuEkle(
					vadeTarihi,
					1
				);

			let bugun = new Date();
			bugun = new Date(
				bugun.getFullYear(),
				bugun.getMonth(),
				bugun.getDate()
			);

			let gun =
				Math.ceil(
					(valorluVade - bugun) /
					(1000 * 60 * 60 * 24)
				) + 1;




			cekler.push({
				tutar: tutar,
				gun: gun,
				tarih: tarih
			});

			cekler.sort(function(a, b) {

				return new Date(a.tarih) - new Date(b.tarih);


			});


			listeGuncelle();

			document.getElementById("cekTutar").value = "";
			document.getElementById("cekTarih").value = "";

		}

		function listeGuncelle() {

			let html = "";

			let toplamTutar = 0;
			let toplamVadeCarpim = 0;

			for (let i = 0; i < cekler.length; i++) {

				toplamTutar += cekler[i].tutar;

				toplamVadeCarpim +=
					cekler[i].tutar * cekler[i].gun;

				html += `
<b>${i+1}. Çek</b><br>

${tl(cekler[i].tutar)} TL<br>

${new Date(cekler[i].tarih)
.toLocaleDateString("tr-TR")}<br>

${cekler[i].gun} Gün

<br><br>

<button onclick="cekSil(${i})">
SİL
</button>

<hr>
`;

			}


			let ortalamaVade = 0;

			if (toplamTutar > 0) {

				ortalamaVade =
					toplamVadeCarpim / toplamTutar;

			}

			document.getElementById("cekOzet").innerHTML =
				`

<b>Toplam Çek Tutarı:</b>

${tl(toplamTutar)} TL

<br><br>

<b>Ağırlıklı Ortalama Vade:</b>

${ortalamaVade.toFixed(0)} Gün

`;

			document.getElementById("cekListe").innerHTML =
				html || "Çek listesi burada görüntülenecektir.";
			let faiz =
				parseFloat(
					document.getElementById("cekFaiz").value
					.replace(",", ".")
				) || 0;

			let komisyon =
				parseFloat(
					document.getElementById("cekKomisyon").value
					.replace(",", ".")
				) || 0;

			let masraf =
				parseFloat(
					document.getElementById("cekMasraf").value
					.replace(",", ".")
				) || 0;

			let faizTutari =
				(toplamTutar * faiz * ortalamaVade) / 36000;

			let komisyonTutari =
				(toplamTutar * komisyon) / 100;

			let bsmv =
				(faizTutari + komisyonTutari + masraf) * 0.05;

			let toplamKesinti =
				faizTutari +
				komisyonTutari +
				masraf +
				bsmv;

			let netOdeme =
				toplamTutar - toplamKesinti;

			let basitOran = 0;

			if (ortalamaVade > 0 && toplamTutar > 0) {

				basitOran =
					(
						(toplamKesinti / 1.05) *
						36000 /
						toplamTutar /
						ortalamaVade
					);

			}

			let katkiliOran = 0;

			if (netOdeme > 0 && ortalamaVade > 0) {

				katkiliOran =
					(
						(faiz + ((360 / ortalamaVade) * komisyon)) *
						toplamTutar /
						netOdeme
					);

			}

			let getiri = 0;

			if (ortalamaVade > 0) {

				getiri =
					(
						(
							(faizTutari + komisyonTutari + masraf) *
							36000
						) /
						(
							(
								((toplamTutar - netOdeme) / 1.05) *
								0.05 +
								netOdeme
							) *
							ortalamaVade
						)
					);

			}


			document.getElementById("cekSonuc").innerHTML =
				`

<b>Faiz Tutarı:</b>
${tl(faizTutari)}

<br><br>

<b>Komisyon Tutarı:</b>
${tl(komisyonTutari)}

<br><br>

<b>BSMV:</b>
${tl(bsmv)}

<br><br>

<b>Toplam Kesinti:</b>
${tl(toplamKesinti)}

<br><br>

<b>Net Ödeme:</b>
${tl(netOdeme)}

<br><br>

<b>Basit Oran:</b>
% ${basitOran.toFixed(2)}

<br><br>

<b>Katkılı Oran:</b>
% ${katkiliOran.toFixed(2)}

<br><br>

<b>Getiri:</b>
% ${getiri.toFixed(2)}

`;


		}

		function cekSil(index) {

			cekler.splice(index, 1);

			listeGuncelle();

		}
	</script>

</body>

</html>
