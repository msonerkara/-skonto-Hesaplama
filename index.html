<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>İskonto Pro V4</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6fa;
    padding:0;
    margin:0;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
    width:100%;
    box-sizing:border-box;
}

h2{
    margin-top:0;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    margin-top:5px;
}

.result{
    background:#eef5ff;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
    border-left:5px solid #2563eb;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.tab{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    background:#dbeafe;
    color:#1e3a8a;
}

.tab.active{
    background:#2563eb;
    color:white;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

hr{
    border:none;
    border-top:1px solid #ccc;
    margin:15px 0;
}

</style>
</head>


<body>


<div class="tabs">

<button
id="btnPesin"
class="tab active"
onclick="showPage('pesin')">

Peşin İskonto

</button>


<button
id="btnCek"
class="tab"
onclick="showPage('cek')">

Çek İskonto

</button>

</div>



<!-- ========================= -->
<!-- PEŞİN İSKONTO -->
<!-- ========================= -->

<div id="pesin" class="page active">

<div class="card">

<h2>Peşin İskonto</h2>


<input
id="tutar"
inputmode="decimal"
placeholder="İşlem Tutarı">


<input
id="faiz"
inputmode="decimal"
placeholder="Faiz Oranı %">


<input
id="komisyon"
inputmode="decimal"
placeholder="Komisyon Oranı %">


<input
id="masraf"
inputmode="decimal"
placeholder="Masraf">


<input
id="vade"
inputmode="decimal"
placeholder="Vade Gün">


<button onclick="hesapla()">
HESAPLA
</button>


<button onclick="temizle()">
TEMİZLE
</button>


<div id="sonuc" class="result">

Hesaplama sonucu burada görüntülenecektir.

</div>

</div>

</div>



<!-- ========================= -->
<!-- ÇEK İSKONTO -->
<!-- ========================= -->

<div id="cek" class="page">

<div class="card">

<h2>Çek İskonto</h2>


<input
id="cekFaiz"
inputmode="decimal"
oninput="listeGuncelle()"
placeholder="Faiz Oranı %">


<input
id="cekKomisyon"
inputmode="decimal"
oninput="listeGuncelle()"
placeholder="Komisyon Oranı %">


<input
id="cekMasraf"
inputmode="decimal"
oninput="listeGuncelle()"
placeholder="Masraf">


<div class="result">

<b>ÇEK GİRİŞİ</b>

</div>


<label><b>Çek Tutarı</b></label>

<input
id="cekTutar"
inputmode="decimal"
placeholder="Çek Tutarı">


<label><b>📅 Vade Tarihi</b></label>

<input
id="cekTarih"
type="date"
style="
font-size:18px;
font-weight:bold;
background:white;
">


<button onclick="cekEkle()">
ÇEK EKLE
</button>



<div id="cekOzet" class="result">

Toplam Çek Tutarı: 0,00 TL

<br><br>

Ağırlıklı Ortalama Vade: 0 Gün

</div>



<div id="cekListe" class="result">

Çek listesi burada görüntülenecektir.

</div>



<div id="cekSonuc" class="result">

Hesaplama sonucu burada görüntülenecektir.

</div>

</div>

</div>



<script>


/* ==================================================
   ÇEK LİSTESİ
================================================== */

let cekler = [];



/* ==================================================
   RESMİ TATİLLER
================================================== */

const tatiller = [

"2026-01-01",

"2026-03-20",
"2026-03-21",
"2026-03-22",
"2026-03-23",

"2026-04-23",

"2026-05-01",
"2026-05-19",

"2026-05-26",
"2026-05-27",
"2026-05-28",
"2026-05-29",
"2026-05-30",

"2026-07-15",

"2026-08-30",

"2026-10-28",
"2026-10-29",


"2027-01-01",

"2027-03-08",
"2027-03-09",
"2027-03-10",

"2027-05-01",

"2027-05-16",
"2027-05-17",
"2027-05-18",
"2027-05-19",

"2027-07-15",

"2027-08-30",

"2027-10-28",
"2027-10-29",


"2028-01-01",

"2028-02-25",
"2028-02-26",
"2028-02-27",
"2028-02-28",

"2028-04-23",

"2028-05-01",

"2028-05-04",
"2028-05-05",
"2028-05-06",
"2028-05-07",
"2028-05-08",

"2028-05-19",

"2028-07-15",

"2028-08-30",

"2028-10-28",
"2028-10-29"

];



/* ==================================================
   TARİH OLUŞTUR
================================================== */

function tarihOlustur(tarih){

    let p = tarih.split("-");

    return new Date(
        Number(p[0]),
        Number(p[1])-1,
        Number(p[2])
    );

}



/* ==================================================
   TARİH STRING
================================================== */

function tarihString(tarih){

    let yil =
        tarih.getFullYear();

    let ay =
        String(
            tarih.getMonth()+1
        ).padStart(2,"0");

    let gun =
        String(
            tarih.getDate()
        ).padStart(2,"0");

    return yil+"-"+ay+"-"+gun;

}



/* ==================================================
   İŞ GÜNÜ MÜ?
================================================== */

function isIsGunu(tarih){

    let gun =
        tarih.getDay();

    let str =
        tarihString(tarih);

    return (
        gun !== 0 &&
        gun !== 6 &&
        !tatiller.includes(str)
    );

}



/* ==================================================
   EXCEL İŞGÜNÜ
==================================================

Excel:

İŞGÜNÜ(tarih;1;tatiller)

================================================== */

function excelIsGunu(tarih, adet){

    let sonuc =
        new Date(
            tarih.getFullYear(),
            tarih.getMonth(),
            tarih.getDate()
        );


    if(adet > 0){

        /*
        Excel İŞGÜNÜ:
        Başlangıç tarihinden sonraki
        iş günlerini sayar.
        */

        while(adet > 0){

            sonuc.setDate(
                sonuc.getDate()+1
            );

            if(isIsGunu(sonuc)){

                adet--;

            }

        }

    }


    if(adet < 0){

        while(adet < 0){

            sonuc.setDate(
                sonuc.getDate()-1
            );

            if(isIsGunu(sonuc)){

                adet++;

            }

        }

    }


    return sonuc;

}



/* ==================================================
   ANA VADE HESABI
==================================================

EXCEL FORMÜLÜ:

=EĞER(
 K4=0;
 0;
 İŞGÜNÜ(
   İŞGÜNÜ(K4-1;1;N4:N36);
   1;
   N4:N36
 )
 +1
 -BUGÜN()
)

================================================== */

function vadeHesapla(vadeTarihi){

    let valor = new Date(
        vadeTarihi.getFullYear(),
        vadeTarihi.getMonth(),
        vadeTarihi.getDate()
    );

    // +1 gün
    valor.setDate(valor.getDate() + 1);

    // iş gününe yuvarla
    while(!isIsGunu(valor)){
        valor.setDate(valor.getDate() + 1);
    }

    let bugun = new Date();

    bugun = new Date(
        bugun.getFullYear(),
        bugun.getMonth(),
        bugun.getDate()
    );

    return Math.floor(
        (valor - bugun) / 86400000
    );
}

/* ==================================================
   TL FORMAT
================================================== */

function tl(x){

    return x.toLocaleString(
        "tr-TR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}



/* ==================================================
   PEŞİN HESAP
================================================== */

function hesapla(){

    let tutar =
        parseFloat(
            document.getElementById("tutar")
            .value
            .replace(/\./g,"")
            .replace(",",".")
        ) || 0;


    let faiz =
        parseFloat(
            document.getElementById("faiz")
            .value
            .replace(",",".")
        ) || 0;


    let komisyon =
        parseFloat(
            document.getElementById("komisyon")
            .value
            .replace(",",".")
        ) || 0;


    let masraf =
        parseFloat(
            document.getElementById("masraf")
            .value
            .replace(",",".")
        ) || 0;


    let vade =
        parseFloat(
            document.getElementById("vade")
            .value
            .replace(",",".")
        ) || 0;


    if(
        tutar <= 0 ||
        faiz < 0 ||
        komisyon < 0 ||
        vade <= 0
    ){

        alert(
            "Lütfen tüm alanları doğru giriniz."
        );

        return;

    }


    let faizTutari =
        (
            tutar *
            faiz *
            vade
        ) / 36000;


    let komisyonTutari =
        (
            tutar *
            komisyon
        ) / 100;


    let bsmv =
        (
            faizTutari +
            komisyonTutari +
            masraf
        ) * 0.05;


    let toplamKesinti =
        faizTutari +
        komisyonTutari +
        masraf +
        bsmv;


    let netOdeme =
        tutar -
        toplamKesinti;


    let basitOran =
        (
            (toplamKesinti/1.05) *
            36000 /
            tutar /
            vade
        );


    let katkiliOran = 0;


    if(netOdeme > 0){

        katkiliOran =
            (
                (
                    faiz +
                    (
                        (360/vade) *
                        komisyon
                    )
                )
                *
                tutar /
                netOdeme
            );

    }


    let getiri = 0;


    if(vade > 0){

        getiri =
            (
                (
                    faizTutari +
                    komisyonTutari +
                    masraf
                )
                *
                36000
            )
            /
            (
                (
                    (
                        (tutar-netOdeme)/1.05
                    )
                    *
                    0.05
                    +
                    netOdeme
                )
                *
                vade
            );

    }


    document.getElementById("sonuc")
    .innerHTML = `

<b>Faiz Tutarı:</b>
${tl(faizTutari)}

<br><br>

<b>Komisyon Tutarı:</b>
${tl(komisyonTutari)}

<br><br>

<b>BSMV:</b>
${tl(bsmv)}

<br><br>

<b>Toplam Kesinti:</b>
${tl(toplamKesinti)}

<br><br>

<b>Net Ödeme:</b>
${tl(netOdeme)}

<br><br>

<b>Basit Oran:</b>
% ${basitOran.toFixed(2)}

<br><br>

<b>Katkılı Oran:</b>
% ${katkiliOran.toFixed(2)}

<br><br>

<b>Getiri:</b>
% ${getiri.toFixed(2)}

`;

}



/* ==================================================
   TEMİZLE
================================================== */

function temizle(){

    document.getElementById("tutar").value="";
    document.getElementById("faiz").value="";
    document.getElementById("komisyon").value="";
    document.getElementById("masraf").value="";
    document.getElementById("vade").value="";

    document.getElementById("sonuc")
    .innerHTML =
        "Hesaplama sonucu burada görünecektir.";

}



/* ==================================================
   SAYFA
================================================== */

function showPage(page){

    document
    .getElementById("pesin")
    .classList
    .remove("active");

    document
    .getElementById("cek")
    .classList
    .remove("active");

    document
    .getElementById("btnPesin")
    .classList
    .remove("active");

    document
    .getElementById("btnCek")
    .classList
    .remove("active");


    if(page === "pesin"){

        document
        .getElementById("pesin")
        .classList
        .add("active");

        document
        .getElementById("btnPesin")
        .classList
        .add("active");

    }

    else{

        document
        .getElementById("cek")
        .classList
        .add("active");

        document
        .getElementById("btnCek")
        .classList
        .add("active");

    }

}



/* ==================================================
   ÇEK EKLE
================================================== */

function cekEkle(){

    let tutar =
        parseFloat(
            document.getElementById("cekTutar")
            .value
            .replace(/\./g,"")
            .replace(",",".")
        ) || 0;


    let tarih =
        document
        .getElementById("cekTarih")
        .value;


    if(
        tutar <= 0 ||
        !tarih
    ){

        alert(
            "Çek tutarı ve tarih giriniz."
        );

        return;

    }


    /*
    Vade tarihini oluştur
    */

    let vadeTarihi =
        tarihOlustur(tarih);


    /*
    TEK VADE HESABI
    */

    let gun =
        vadeHesapla(
            vadeTarihi
        );


    /*
    ÇEKİ KAYDET
    */

    cekler.push({

        tutar:tutar,

        tarih:tarih,

        gun:gun

    });


    /*
    TARİHE GÖRE SIRALA
    */

    cekler.sort(
        function(a,b){

            return (
                tarihOlustur(a.tarih) -
                tarihOlustur(b.tarih)
            );

        }
    );


    listeGuncelle();


    /*
    ALANLARI TEMİZLE
    */

    document
    .getElementById("cekTutar")
    .value="";

    document
    .getElementById("cekTarih")
    .value="";

}



/* ==================================================
   ÇEK LİSTESİ
================================================== */

function listeGuncelle(){

    let html="";

    let toplamTutar=0;

    let toplamVadeCarpim=0;


    for(
        let i=0;
        i<cekler.length;
        i++
    ){

        toplamTutar +=
            cekler[i].tutar;


        toplamVadeCarpim +=
            cekler[i].tutar *
            cekler[i].gun;


        html += `

<b>${i+1}. Çek</b>

<br><br>

<b>Tutar:</b>
${tl(cekler[i].tutar)} TL

<br>

<b>Vade Tarihi:</b>
${tarihOlustur(
    cekler[i].tarih
).toLocaleDateString("tr-TR")}

<br>

<b>Vade:</b>
${cekler[i].gun} Gün

<br><br>

<button onclick="cekSil(${i})">
SİL
</button>

<hr>

`;

    }


    let ortalamaVade=0;


    if(toplamTutar>0){

        ortalamaVade =
            toplamVadeCarpim /
            toplamTutar;

    }


    document
    .getElementById("cekOzet")
    .innerHTML = `

<b>Toplam Çek Tutarı:</b>

<br>

${tl(toplamTutar)} TL

<br><br>

<b>Ağırlıklı Ortalama Vade:</b>

<br>

${ortalamaVade.toFixed(0)} Gün

`;



    document
    .getElementById("cekListe")
    .innerHTML =
        html ||
        "Çek listesi burada görüntülenecektir.";



    /*
    ============================
    İSKONTO HESABI
    ============================
    */

    let faiz =
        parseFloat(
            document
            .getElementById("cekFaiz")
            .value
            .replace(",",".")
        ) || 0;


    let komisyon =
        parseFloat(
            document
            .getElementById("cekKomisyon")
            .value
            .replace(",",".")
        ) || 0;


    let masraf =
        parseFloat(
            document
            .getElementById("cekMasraf")
            .value
            .replace(",",".")
        ) || 0;


    let faizTutari =
        (
            toplamTutar *
            faiz *
            ortalamaVade
        ) / 36000;


    let komisyonTutari =
        (
            toplamTutar *
            komisyon
        ) / 100;


    let bsmv =
        (
            faizTutari +
            komisyonTutari +
            masraf
        ) * 0.05;


    let toplamKesinti =
        faizTutari +
        komisyonTutari +
        masraf +
        bsmv;


    let netOdeme =
        toplamTutar -
        toplamKesinti;


    let basitOran=0;


    if(
        ortalamaVade>0 &&
        toplamTutar>0
    ){

        basitOran =
            (
                (toplamKesinti/1.05)
                *
                36000
                /
                toplamTutar
                /
                ortalamaVade
            );

    }


    let katkiliOran=0;


    if(
        netOdeme>0 &&
        ortalamaVade>0
    ){

        katkiliOran =
            (
                (
                    faiz +
                    (
                        (360/ortalamaVade)
                        *
                        komisyon
                    )
                )
                *
                toplamTutar
                /
                netOdeme
            );

    }


    let getiri=0;


    if(ortalamaVade>0){

        getiri =
            (
                (
                    faizTutari +
                    komisyonTutari +
                    masraf
                )
                *
                36000
            )
            /
            (
                (
                    (
                        (toplamTutar-netOdeme)
                        /
                        1.05
                    )
                    *
                    0.05
                    +
                    netOdeme
                )
                *
                ortalamaVade
            );

    }


    document
    .getElementById("cekSonuc")
    .innerHTML = `

<b>Faiz Tutarı:</b>
${tl(faizTutari)}

<br><br>

<b>Komisyon Tutarı:</b>
${tl(komisyonTutari)}

<br><br>

<b>BSMV:</b>
${tl(bsmv)}

<br><br>

<b>Toplam Kesinti:</b>
${tl(toplamKesinti)}

<br><br>

<b>Net Ödeme:</b>
${tl(netOdeme)}

<br><br>

<b>Basit Oran:</b>
% ${basitOran.toFixed(2)}

<br><br>

<b>Katkılı Oran:</b>
% ${katkiliOran.toFixed(2)}

<br><br>

<b>Getiri:</b>
% ${getiri.toFixed(2)}

`;

}



/* ==================================================
   ÇEK SİL
================================================== */

function cekSil(index){

    cekler.splice(
        index,
        1
    );

    listeGuncelle();

}


</script>

</body>
</html>
